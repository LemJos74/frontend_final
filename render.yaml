services:
  - type: web
    name: limpiahuancayo-web
    runtime: static
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/frontend-final/browser
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
